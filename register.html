
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BloodBridge</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">BloodBridge</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="find-donors.html">Find Donors</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="register-container">
    <form class="register-form" id="registerForm">
        <h1>Create Account</h1>
        <p>Join BloodBridge and help connect people.</p>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" minlength="8" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="bloodGroup">Blood Group</label>
        <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label for="district">District</label>
        <input type="text" id="district" placeholder="Enter your district" required>

        <label for="upazila">Upazila</label>
        <input type="text" id="upazila" placeholder="Enter your upazila" required>

        <label class="consent">
            <input type="checkbox" id="publicConsent" required>
            I agree to share limited profile information in the donor directory.
        </label>

        <button type="submit" class="register-btn">Create Account</button>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
